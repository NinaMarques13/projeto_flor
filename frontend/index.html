<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Decodificação de Memórias — Desvende cada pétala e descubra uma memória especial escondida.">

    <title>Decodificação de Memórias 🌹</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Decorative floating petals -->
    <div class="petals-container" aria-hidden="true">
        <div class="petal petal--1"></div>
        <div class="petal petal--2"></div>
        <div class="petal petal--3"></div>
        <div class="petal petal--4"></div>
        <div class="petal petal--5"></div>
        <div class="petal petal--6"></div>
    </div>

    <!-- Main content -->
    <main class="main">
        <header class="header">
            <p class="header__rose" aria-hidden="true">🌹</p>
            <h1 class="header__title">Decodificação de Memórias</h1>
            <p class="header__subtitle">Cada pétala guarda um segredo.<br>Digite o código e deixe a memória desabrochar.</p>
        </header>

        <section class="decoder" aria-label="Decodificador de memórias">
            <div class="decoder__card">
                <div class="decoder__input-group">
                    <label for="memory-code" class="sr-only">Código da memória</label>
                    <input
                        type="text"
                        id="memory-code"
                        class="decoder__input"
                        placeholder="Digite o código da pétala..."
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <button id="btn-decode" class="decoder__button" type="button">
                        <span class="decoder__button-text">Desabrochar</span>
                        <span class="decoder__button-icon" aria-hidden="true">✿</span>
                    </button>
                </div>

                <!-- Loading spinner -->
                <div id="loader" class="loader" hidden>
                    <div class="loader__spinner"></div>
                    <p class="loader__text">Buscando memória...</p>
                </div>

                <!-- Result area -->
                <div id="result-area" class="result" hidden>
                    <div class="result__divider">
                        <span class="result__divider-icon" aria-hidden="true">❀</span>
                    </div>
                    <div id="result-content" class="result__content">
                        <!-- Dynamic content rendered by main.js -->
                    </div>
                </div>

                <!-- Error area -->
                <div id="error-area" class="error-message" hidden>
                    <p id="error-text" class="error-message__text"></p>
                </div>
            </div>
        </section>

        <footer class="footer">
            <p class="footer__text">Feito com <span class="footer__heart">♥</span> para você</p>
        </footer>
    </main>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
